[package]
name = "ct-regex"
version = "0.1.0"
authors = ["Inferno214221 <inferno214221@gmail.com>"]
edition = "2024"
repository = "https://github.com/Inferno214221/compile-time-regex"
license = "GPL-3.0"
keywords = ["regex", "compile", "const"]
categories = ["text-processing"]
description = "A crate for compiling regular expressions into Rust code at compile-time."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--theme", "./doc/kali-dark.css",
    "--html-in-header", "./doc/robots.html",
    "--enable-index-page",
    "--generate-macro-expansion",
    "-Z", "unstable-options"
]

[workspace]
members = ["bench", "internal", "macro"]

[dependencies]
ct-regex-internal = { path = "internal", features = [] }
ct-regex-macro = { path = "macro"}
arcstr = { version = "1.2.0", optional = true }
bstr = { version = "1.12.1", optional = true }
hipstr = { version = "0.8.0", optional = true }
ecow = { version = "0.2.6", optional = true }

[features]
default = []
demo = []
arcstr = ["dep:arcstr", "ct-regex-internal/arcstr"]
bstr = ["dep:bstr", "ct-regex-internal/bstr"]
ecow = ["dep:ecow", "ct-regex-internal/ecow"]
hipstr = ["dep:hipstr", "ct-regex-internal/hipstr"]